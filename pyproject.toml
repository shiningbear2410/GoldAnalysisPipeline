[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldpipeline"
version = "0.1.0"
description = "Multi-agent XAUUSD analysis pipeline - normalize, write, review, finalize, gate, publish"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    # Already pulled in by the SDKs above, but the publisher uses it directly,
    # so it is declared rather than borrowed.
    "httpx2>=2.0",
    "openai>=1.50",
    "pydantic>=2.7",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Windows-only wheels, and useless without a running terminal, so the MT5
# market-data source is an extra rather than a hard dependency. Every test runs
# without it; only `mt5-check` and `--market-source mt5` need it installed.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
# The OS credential store. An extra because the whole suite runs without it
# and the environment-variable path still works; it is what an unattended
# scheduled task needs, since that inherits no session.
secrets = ["keyring>=25.0"]

[project.scripts]
goldpipeline = "goldpipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The vendor ships no type stubs.
module = ["MetaTrader5"]
ignore_missing_imports = true
